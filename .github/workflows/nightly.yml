# Rolling nightly Go binaries. Not a versioned release. Do not cut 0.1.0.
#
# Triggers:
# - 02:00 UTC schedule
# - workflow_dispatch
# - after the report-only CI workflow succeeds on main (workflow_run)
#
# Does not run on pull requests. Does not publish a new tag per PR or per
# semver. Always replaces the single `nightly` prerelease and its assets.
#
# Binaries are `make build` flags (CGO_ENABLED=0 -ldflags="-s -w"), named
# as the executable: dango-linux-amd64, dango-darwin-arm64.
# No darwin/amd64. No semver / 0.1.0.

name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile stripped binaries
        run: make dist

      - name: Asset sizes
        run: |
          set -euo pipefail
          echo "===== wc -c (executable bytes, not a bundle) ====="
          wc -c dist/dango-linux-amd64 dist/dango-darwin-arm64
          {
            echo "## Nightly assets"
            echo
            echo "| Asset | Bytes |"
            echo "| --- | ---: |"
            for f in dist/dango-linux-amd64 dist/dango-darwin-arm64; do
              printf '| `%s` | %s |\n' "${f#dist/}" "$(wc -c < "$f")"
            done
            echo
            echo "Stripped Go executables (\`CGO_ENABLED=0 -ldflags=\"-s -w\"\`). Not a JS bundle."
            echo "Replaces the single \`nightly\` prerelease. Not 0.1.0."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Replace nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --title "Nightly" \
            --prerelease \
            --target "${sha}" \
            --notes "Rolling nightly binaries (not a versioned release; not 0.1.0).
          Replaced each night / after CI on main. Same flags as \`make build\`: CGO_ENABLED=0 -ldflags=\"-s -w\".

          Assets:
          - dango-linux-amd64
          - dango-darwin-arm64

          Commit: ${sha}" \
            dist/dango-linux-amd64 \
            dist/dango-darwin-arm64
